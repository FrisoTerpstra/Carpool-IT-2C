services:
  api:
    build: .
    environment:
      APP_PROFILE: ${APP_PROFILE:-dev}
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE:-carpool}
      SPRING_DATASOURCE_USERNAME: ${MARIADB_USER:-carpool}
      SPRING_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8085}:8080"
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11.4.13
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-carpool}
      MARIADB_USER: ${MARIADB_USER:-carpool}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      # SQL files added here later run only when creating a new database.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8086}:80"

volumes:
  mariadb_data:
