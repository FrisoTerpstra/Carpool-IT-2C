spring.application.name=demoproject
server.port=${SERVER_PORT:8085}

# Run from the project root. Environment variables can override this local file.
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${APP_PROFILE:default}
spring.datasource.url=jdbc:mariadb://localhost:${DB_PORT:3307}/${MARIADB_DATABASE:carpool}
spring.datasource.username=${MARIADB_USER:carpool}
spring.datasource.password=${MARIADB_PASSWORD}

# Table definitions will be added later; do not generate or reset them yet.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never
